version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: vuln_db
      POSTGRES_USER: vuln_user
      POSTGRES_PASSWORD: vuln_pass
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: vuln_db
      DB_USER: vuln_user
      DB_PASSWORD: vuln_pass
    ports:
      - "8080:8080"
    depends_on:
      - db
    command: sh -c "flask db upgrade && python -m app.main"
